<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RainPhil Physical Count</title>
<style>
:root{--ink:#1d2433;--mut:#6b7385;--line:#dfe3ec;--bg:#f4f6fa;--pri:#1f5fbf;--pri2:#e8f0fc;--ok:#1e7d4b;--okbg:#e4f5ec;--warn:#a05a00;--warnbg:#fff1dc;--bad:#b3261e;--badbg:#fde8e6}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;color:var(--ink)}
button:hover{background:#f0f3f9}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.pri:hover{background:#184f9f}
button.danger{color:var(--bad);border-color:#efb8b4}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid #c9cfdc;border-radius:6px;padding:5px 8px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9ec0f5;border-color:var(--pri)}
input:disabled,select:disabled{background:#f1f3f7;color:#8a90a0}
header.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:16px;margin:0}header.top nav{display:flex;gap:4px;flex:1}
header.top nav button{border:0;background:none;padding:6px 12px;border-radius:6px}header.top nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
.who{color:var(--mut);font-size:13px}.who b{color:var(--ink)}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.mut{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th{position:sticky;top:0;background:#eef1f7;text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);z-index:5;white-space:nowrap}
table.t td{padding:4px 8px;border-bottom:1px solid #edf0f5;vertical-align:middle}
table.t tr:hover td{background:#fafbfe}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
td.num,th.num{text-align:right}td.ser,th.ser{min-width:150px;overflow-wrap:anywhere}td.lot{min-width:90px;overflow-wrap:anywhere}td input.q{width:70px;text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef1f7;color:#445}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-pri{background:var(--pri2);color:var(--pri)}
.steps{display:flex;gap:0;margin:10px 0 4px;flex-wrap:wrap}
.steps div{padding:5px 14px;background:#e9edf4;color:var(--mut);font-size:12px;border-right:2px solid #fff}
.steps div.done{background:#cfe3d8;color:#245}.steps div.cur{background:var(--pri);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px}.tabs button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills button{border-radius:20px;padding:3px 12px;font-size:13px}.pills button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#modal{position:fixed;inset:0;background:rgba(20,28,45,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
#modal .box{background:#fff;border-radius:12px;padding:20px;width:min(720px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal .box.wide{width:min(980px,100%)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fg label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}.fg input,.fg select,.fg textarea{width:100%}
#toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
#toast div{background:#1d2433;color:#fff;padding:9px 14px;border-radius:8px;max-width:420px}#toast div.err{background:var(--bad)}
#pill{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#1b2a41;color:#fff;padding:6px 16px;border-radius:20px;font-size:13px;z-index:100;display:none;box-shadow:0 2px 10px #0004}#blk{position:fixed;inset:0;z-index:98;display:none;cursor:progress}
#busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#8fb6f2);display:none;z-index:99}
.login{max-width:380px;margin:12vh auto}.login .card{padding:24px}.login input,.login select{width:100%;margin-bottom:10px}
.brandlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.brandlist label{display:flex;gap:6px;align-items:center;font-size:13px}
.note{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px}
.chip{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:8px;padding:0 6px;font-size:11px;margin:1px}
canvas.sig{border:1px dashed #9aa3b8;border-radius:8px;background:#fff;touch-action:none;width:100%;max-width:420px;height:150px}
.demo{background:#fff6d6;color:#7a5b00;text-align:center;font-size:12px;padding:4px}
td.st{white-space:nowrap;font-size:12px;font-weight:600}.st-m{color:var(--ok)}.st-x{color:var(--warn)}.st-p{color:#9aa3b8}.st-r{color:var(--pri)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff}#printArea{display:block}
  @page{size:A4 landscape;margin:9mm 9mm 12mm 9mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:8pt}}
  .sheet{page-break-before:always}.sheet:first-child{page-break-before:auto}
}
#printArea{font:9pt/1.25 Arial,Helvetica,sans-serif;color:#000}
#printArea table{border-collapse:collapse;width:100%}#printArea table.ps{table-layout:fixed}#printArea table.ps td,#printArea table.ps th{overflow-wrap:anywhere;word-break:break-word}#printArea th,#printArea td{border:1px solid #444;padding:2px 4px;vertical-align:top}
#printArea th{background:#111;color:#fff;border-color:#111;font-size:7.5pt;letter-spacing:.04em;text-transform:uppercase;text-align:left}#printArea thead td.ttl{border:0;border-bottom:2.5px solid #111;font-size:17pt;font-weight:800;letter-spacing:-.01em;padding:0 0 5px}#printArea thead td.ttl small{display:block;font-size:7.5pt;letter-spacing:.14em;font-weight:700}#printArea tr.gh td{background:#fff;font-size:7pt;font-weight:700;letter-spacing:.06em;text-align:center;padding:1px}@media screen{#printArea .sg b[contenteditable]{outline:1px dashed #7a9cc6;cursor:text}}#printArea td.sf .sg{margin-top:4px;gap:20px}#printArea td.sf .sg>div{min-height:30px;font-size:7.5pt}#printArea td.sf .sg img{max-height:28px}#printArea tr.mom td{background:#e6e6e6;font-weight:700}
#printArea thead td.inf{border:0;padding:1px 0 4px;font-size:8.5pt}
#printArea tr{page-break-inside:avoid}#printArea tr.bb td{background:#f2f2f2}#printArea td.w{height:20px}#printArea tr.grp td{background:#f0d9d6;font-weight:bold;text-align:center}
#printArea .sg{display:flex;gap:28px;margin-top:14px;page-break-inside:avoid}#printArea .sg>div{flex:1;border-top:1px solid #000;padding-top:3px;font-size:8.5pt;min-height:50px}#printArea td.sf{border:0;border-top:1.5px solid #000;padding:12px 0 0;font-size:9pt}#printArea tfoot{display:table-footer-group}
#printArea .sg img{max-height:46px;display:block;margin-bottom:2px}
#printArea h2{font-size:14pt;margin:0 0 6px}#printArea ul{margin:4px 0 10px;padding-left:18px}#printArea li{margin:3px 0}

table.pre input{field-size:auto;field-sizing:content;min-width:70px;max-width:300px}table.pre td{white-space:nowrap}table.pre td.wr{white-space:normal;min-width:160px}table.pre input.q{width:70px;min-width:70px}
table.pre tr.xr td{background:#fffbe9}table.pre tr.chg td{background:#eef6ff}
@media(max-width:700px){main{padding:10px}header.top{flex-wrap:wrap;gap:6px}}
/* ---- phone / tablet ---- */
html{-webkit-text-size-adjust:100%}button,select,input,summary{touch-action:manipulation}
@media(max-width:1024px){
 main{padding:12px}header.top{flex-wrap:wrap;gap:8px;padding:8px 12px}header.top nav{order:3;flex:1 0 100%;overflow-x:auto;white-space:nowrap}
 input,select,textarea{font-size:16px!important}button{min-height:40px}
 .tabs{overflow-x:auto;white-space:nowrap}.tabs button{flex:0 0 auto}
 #modal{padding:8px;align-items:flex-start;overflow:auto}#modal .box{width:100%;max-height:none;padding:14px}
 .fg{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}
 .login{margin:6vh auto;padding:0 12px}.who{font-size:12px}
 #pill{top:auto;bottom:14px}
}
@media(max-width:640px){
 .fg{grid-template-columns:1fr}
 header.top h1{font-size:14px}
 .row>input,.row>select{flex:1 1 140px;min-width:0}
}
@media(max-width:900px){
 /* pre-count as cards */
 table.pre,table.pre tbody,table.pre tr,table.pre td{display:block;width:auto}
 table.pre thead{display:none}
 .tw:has(table.pre){border:0;background:transparent;overflow:visible;max-height:none!important}
 table.pre tr{border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:8px 10px;background:#fff}
 table.pre tr.xr{background:#fffbe9}table.pre tr.chg{background:#eef6ff}
 table.pre td{display:flex;align-items:center;gap:8px;padding:3px 0;border:0;white-space:normal!important;min-width:0!important}
 table.pre td::before{content:attr(data-label);flex:0 0 86px;font-size:12px;color:var(--mut)}
 table.pre td input,table.pre td select{flex:1;min-width:0!important;max-width:none!important;width:auto!important}
 table.pre td.wr{min-width:0!important}
 table.pre td[colspan]{display:flex}
}
@media(min-width:641px) and (max-width:900px){table.pre tr{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}table.pre td.wr,table.pre td[colspan]{grid-column:1/-1}}

#pvBar{position:fixed;top:0;left:0;right:0;height:50px;background:#1d2433;color:#fff;display:none;align-items:center;gap:10px;padding:0 16px;z-index:70}
#pvBar b{flex:1;font-weight:600}#pvBar button{background:#fff}#pvBar button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
body.preview{overflow:hidden}
body.preview #printArea{display:block;position:fixed;inset:0;top:50px;background:#d9dde6;overflow:auto;padding:18px;z-index:60;font-size:10pt}
body.preview .sheet{background:#fff;width:1120px;max-width:none;margin:0 auto 18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@media print{
  body.preview #printArea{position:static;overflow:visible;background:#fff;padding:0;font-size:9pt}
  body.preview .sheet{box-shadow:none;width:auto;margin:0;padding:0}
}

<script>/* ===== RainCount core (shared by Apps Script backend and the demo/mock page) =====
   Pure logic: authentication, roles, status flow, signatures. Storage is supplied by an adapter `db`. */
var ITEM_FIELDS = ['id','brand','category','pn','desc','serial','lot','expiry','uom','looseUom','packSize','location','storage','sysQty','asOf','unitPrice','notes','section','source','flags','active','motherId'];
var LINE_FIELDS = ['lineId','itemId','brand','category','pn','desc','serial','lot','expiry','uom','looseUom','packSize','location','storage','section','sysQty','unitPrice','isExtra','cF','cL','kF','kL','rF','rL','recountBy','reason','remarks','motherId','babyOk','orig','changeReason'];
var SESSION_FIELDS = ['id','name','date','status','brands','includeExpired','notes','assign','createdBy','createdAt','returnNote','lineCount','kind','preId'];
var USER_FIELDS = ['name','role','salt','pinHash','active'];
var SIG_FIELDS = ['sessionId','role','name','signedAt','image','brand'];
var LOG_FIELDS = ['time','user','action','detail'];
var STATUSES = ['Draft','Counting','Encoding','Review','Verification','Approval','Approved'];
var EDITABLE = ['Draft','Counting','Encoding','Review'];
var ENC_FLOW = {Draft:['Counting'],Counting:['Draft','Encoding'],Encoding:['Counting','Review'],Review:['Encoding','Verification'],Verification:['Review']};

function core(db, req) {
  try { return {ok:true, data: route(db, req || {})}; }
  catch (e) { return {ok:false, error: String((e && e.message) || e)}; }
}
function pad(n, w) { n = String(n); while (n.length < w) n = '0' + n; return n; }
function numOrBlank(v) { if (v === '' || v === null || v === undefined) return ''; var n = Number(v); return isNaN(n) ? '' : n; }
function toJson(v, d) { if (typeof v !== 'string') return v == null ? d : v; try { return JSON.parse(v); } catch (e) { return d; } }
function sessionOut(s) {
  return {id:s.id, name:s.name, date:s.date, status:s.status, brands:toJson(s.brands, []), includeExpired:s.includeExpired === true || s.includeExpired === 'TRUE' || s.includeExpired === 'true' || s.includeExpired === 'Y',
          kind:s.kind === 'pre' ? 'pre' : 'count', preId:s.preId || '', notes:s.notes || '', assign:toJson(s.assign, {}), createdBy:s.createdBy, createdAt:s.createdAt, returnNote:s.returnNote || '', lineCount:Number(s.lineCount) || 0};
}
function findSession(db, id) {
  var all = db.all('Sessions');
  for (var i = 0; i < all.length; i++) if (String(all[i].id) === String(id)) return all[i];
  throw new Error('Session not found');
}
function auth(db, token) {
  var raw = token ? db.cacheGet('t_' + token) : null;
  if (!raw) throw new Error('SESSION_EXPIRED');
  db.cachePut('t_' + token, raw, 21600);
  return JSON.parse(raw);
}
function changedFields(l) {
  if (!l.orig || l.isExtra === 'Y') return [];
  var o = {}; try { o = JSON.parse(l.orig); } catch (e) { return []; }
  return ['pn', 'desc', 'uom', 'category'].filter(function (k) { return String(o[k] == null ? '' : o[k]).trim() !== String(l[k] == null ? '' : l[k]).trim(); });
}
function need(u, roles) { if (roles.indexOf(u.role) < 0) throw new Error('Your role (' + u.role + ') is not allowed to do this'); }
function log(db, u, action, detail) { db.append('Log', [{time:db.now(), user:u.name, action:action, detail:detail || ''}]); }
function findUser(db, name) {
  var us = db.all('Users'), n = String(name || '').trim().toLowerCase();
  for (var i = 0; i < us.length; i++) if (String(us[i].name).trim().toLowerCase() === n) return us[i];
  return null;
}
function checkPin(db, user, pin) { return user && user.active !== 'N' && db.hashPin(String(pin || ''), user.salt) === user.pinHash; }

function route(db, req) {
  var a = req.action, d = req.data || {};
  if (a === 'names') return db.all('Users').filter(function (u) { return u.active !== 'N'; }).map(function (u) { return u.name; });
  if (a === 'login') {
    var fk = 'f_' + String(d.name || '').toLowerCase(), fails = Number(db.cacheGet(fk) || 0);
    if (fails >= 5) throw new Error('Too many wrong PINs. Wait 10 minutes and try again.');
    var user = findUser(db, d.name);
    if (!checkPin(db, user, d.pin)) { db.cachePut(fk, String(fails + 1), 600); throw new Error('Wrong name or PIN'); }
    var token = db.uuid();
    db.cachePut('t_' + token, JSON.stringify({name:user.name, role:user.role}), 21600);
    return {token:token, user:{name:user.name, role:user.role}};
  }
  var u = auth(db, req.token);
  switch (a) {
    case 'bootstrap': {
      if (u.role === 'logistics') return {user:u, items:[], users:[], sessions:db.all('Sessions').map(sessionOut).filter(function (s) { return s.kind === 'pre' && (s.status === 'Open' || s.status === 'Submitted'); })};
      return {user:u, items:db.all('Items'), sessions:db.all('Sessions').map(sessionOut),
              users:u.role === 'encoder' ? db.all('Users').map(function (x) { return {name:x.name, role:x.role, active:x.active === 'N' ? 'N' : 'Y'}; }) : []};
    }
    case 'saveItem': {
      need(u, ['encoder']);
      var it = d.item || {};
      if (!it.brand) throw new Error('Brand is required');
      if (!it.id) it.id = 'ITM' + Date.now().toString(36).toUpperCase();
      it.sysQty = numOrBlank(it.sysQty); it.unitPrice = numOrBlank(it.unitPrice); it.packSize = numOrBlank(it.packSize);
      db.upsert('Items', 'id', [it]);
      log(db, u, 'saveItem', it.id + ' ' + (it.pn || it.desc));
      return it;
    }
    case 'importItems': {
      need(u, ['encoder']);
      var rows = (d.items || []).map(function (r) { r.sysQty = numOrBlank(r.sysQty); r.unitPrice = numOrBlank(r.unitPrice); r.packSize = numOrBlank(r.packSize); return r; });
      if (d.mode === 'replace' && d.first) db.replace('Items', []);
      db.append('Items', rows);
      log(db, u, 'importItems', (d.mode || 'append') + ' +' + rows.length);
      return {added:rows.length};
    }
    case 'saveUser': {
      need(u, ['encoder']);
      var nm = String(d.name || '').trim(), role = d.role;
      if (!nm) throw new Error('Name is required');
      if (['encoder', 'verifier', 'approver', 'logistics'].indexOf(role) < 0) throw new Error('Role must be encoder, verifier, approver or logistics');
      var ex = findUser(db, nm), rec;
      if (ex) {
        rec = ex; rec.role = role; rec.active = d.active === 'N' ? 'N' : 'Y';
        if (d.pin) { if (!/^\d{4,8}$/.test(d.pin)) throw new Error('PIN must be 4-8 digits'); rec.salt = db.uuid(); rec.pinHash = db.hashPin(String(d.pin), rec.salt); }
      } else {
        if (!/^\d{4,8}$/.test(d.pin || '')) throw new Error('PIN must be 4-8 digits');
        var salt = db.uuid();
        rec = {name:nm, role:role, salt:salt, pinHash:db.hashPin(String(d.pin), salt), active:'Y'};
      }
      var after = db.all('Users').filter(function (x) { return x.name !== rec.name; }).concat([rec]);
      if (!after.some(function (x) { return x.role === 'encoder' && x.active !== 'N'; })) throw new Error('At least one active encoder is required');
      db.upsert('Users', 'name', [rec]);
      log(db, u, 'saveUser', nm + ' (' + role + ')');
      return {name:rec.name, role:rec.role, active:rec.active};
    }
    case 'createSession': {
      need(u, ['encoder']);
      var brands = d.brands || [];
      if (!d.name || !brands.length) throw new Error('Session name and at least one brand are required');
      var items = db.all('Items').filter(function (i) {
        return i.active !== 'N' && brands.indexOf(i.brand) >= 0 && (i.section !== 'Expired' || d.includeExpired);
      });
      if (!items.length) throw new Error('No items found for the selected brands');
      var kind = d.kind === 'pre' ? 'pre' : 'count';
      var sid = (kind === 'pre' ? 'P' : 'S') + db.now().slice(0, 10).replace(/-/g, '') + '-' + pad(Math.floor(Math.random() * 1000), 3);
      var lines = items.map(function (i, n) {
        return {lineId:sid + '-' + pad(n + 1, 5), itemId:i.id, brand:i.brand, category:i.category, pn:i.pn, desc:i.desc, serial:i.serial, lot:i.lot, expiry:i.expiry, uom:i.uom,
                looseUom:i.looseUom || '', packSize:numOrBlank(i.packSize), location:i.location, storage:i.storage, section:i.section || 'Active', sysQty:numOrBlank(i.sysQty), unitPrice:numOrBlank(i.unitPrice),
                isExtra:'', cF:'', cL:'', kF:'', kL:'', rF:'', rL:'', recountBy:'', reason:'', remarks:'', motherId:i.motherId || '', babyOk:'', orig:kind === 'pre' ? JSON.stringify({pn:i.pn || '', desc:i.desc || '', uom:i.uom || '', category:i.category || ''}) : '', changeReason:''};
      });
      db.createLines(sid, lines);
      var srow = {id:sid, name:d.name, date:d.date || db.now().slice(0, 10), status:kind === 'pre' ? 'Open' : 'Draft', kind:kind, brands:JSON.stringify(brands), includeExpired:d.includeExpired ? 'Y' : '',
                  notes:d.notes || '', assign:'{}', createdBy:u.name, createdAt:db.now(), returnNote:'', lineCount:lines.length};
      db.append('Sessions', [srow]);
      log(db, u, 'createSession', sid + ' ' + d.name + ' (' + lines.length + ' lines)');
      return sessionOut(srow);
    }
    case 'getSession': {
      var s = findSession(db, d.id), glines = db.lines(d.id);
      if (u.role === 'logistics') {
        if (s.kind !== 'pre') throw new Error('Not allowed');
        glines.forEach(function (l) { l.sysQty = ''; l.unitPrice = ''; });
      }
      return {session:sessionOut(s), lines:glines,
              sigs:db.all('Signatures').filter(function (x) { return String(x.sessionId) === String(d.id); })};
    }
    case 'saveMeta': {
      need(u, ['encoder']);
      var s2 = findSession(db, d.id);

<script>

/* ---------- session view ---------- */
async function loadPre() {
  const S = ST.S; if (!S) return; S.pre = null;
  const pid = S.session.preId; if (!pid || S.session.kind === 'pre') return;
  try { const g = await run('getSession', {id:pid}, true); S.pre = {name:g.session.name, status:g.session.status, by:{}}; g.lines.map(normLine).forEach(l => { if (l.itemId) S.pre.by[l.itemId] = l; }); } catch (e) { S.pre = null; }
}
const preTot = l => { const p = ST.S && ST.S.pre && ST.S.pre.by[l.itemId]; return p && N(p.cF) != null ? tot(p.cF, p.cL, N(p.packSize) || 0) : null; };
async function openSession(id) {
  const r = await run('getSession', {id});
  ST.dirty.clear(); setSession(r, ST.S && ST.S.session.id === id ? ST.S : null);
  if (r.session.kind === 'pre') return renderPre();
  await loadPre();
  renderSession();
}
function setSession(r, prev) {
  const lines = r.lines.map(normLine);
  ST.S = {session:r.session, pre:prev ? prev.pre : null, lines, map:Object.fromEntries(lines.map(l => [l.lineId, l])), sigs:r.sigs, itemIds:new Set(lines.map(l => l.itemId).filter(Boolean)), tab:prev ? prev.tab : 'print', brand:prev ? prev.brand : '', f:prev ? prev.f : 'all', q:prev ? prev.q : '', rf:prev ? prev.rf : 'recount'};
  const i = ST.sessions.findIndex(s => s.id === r.session.id); if (i >= 0) ST.sessions[i] = r.session;
  const bs = brandsOf(); if (!ST.S.brand || bs.indexOf(ST.S.brand) < 0) ST.S.brand = bs[0] || '';
}
function normLine(l) { ['cF','cL','kF','kL','rF','rL','sysQty','unitPrice','packSize'].forEach(k => { l[k] = (l[k] === '' || l[k] == null) ? '' : Number(l[k]); }); return l; }
const uomTxt = l => esc(l.uom) + (N(l.packSize) > 0 ? `<br><small>loose = ${esc(l.looseUom || 'pc')} · ${l.packSize} per ${esc(l.uom || 'unit')}</small>` : '');
const isBaby = l => !!(l.motherId && ST.S.itemIds.has(l.motherId));
const brandsOf = () => [...new Set(ST.S.lines.filter(l => !isBaby(l)).map(l => l.brand))].sort();
/* the lines of one brand sheet: mother items sorted by location, each followed by its baby parts (a baby may belong to another brand) */
function linesOfBrand(b) {
  const S = ST.S, tops = sortPrint(S.lines.filter(l => l.brand === b && !isBaby(l))), ids = new Set(tops.map(l => l.itemId).filter(Boolean)), kids = {};
  S.lines.filter(l => isBaby(l) && ids.has(l.motherId)).forEach(l => (kids[l.motherId] = kids[l.motherId] || []).push(l));
  const out = []; tops.forEach(l => { out.push(l); (kids[l.itemId] || []).sort((x, y) => String(x.pn).localeCompare(String(y.pn))).forEach(k => out.push(k)); }); return out;
}
const motherOf = l => ST.S.lines.find(x => x.itemId === l.motherId);
const canEdit = () => isEnc() && ['Draft','Counting','Encoding','Review'].includes(ST.S.session.status);

/* count logic */
function calc(l) {
  if (isBaby(l)) return {st:l.babyOk === 'Y' ? 'babyok' : (l.babyOk === 'N' ? 'babybad' : (l.babyOk === 'M' ? 'babymiss' : 'pending')), sys:0};
  const sys = N(l.sysQty) || 0, pack = N(l.packSize) || 0;
  const cE = N(l.cF) != null, kE = N(l.kF) != null;
  if (!cE || !kE) return {st:'pending', sys};
  const same = N(l.cF) === N(l.kF) && (N(l.cL) || 0) === (N(l.kL) || 0);
  let F = null, L = 0, st = 'mismatch';
  if (same) { F = N(l.cF); L = N(l.cL) || 0; st = 'match'; }
  else if (N(l.rF) != null) { F = N(l.rF); L = N(l.rL) || 0; st = 'recounted'; }
  if (F == null) return {st, sys, cT:tot(l.cF, l.cL, pack), kT:tot(l.kF, l.kL, pack)};
  const total = tot(F, L, pack), v = r4(total - sys);
  return {st, sys, total, v, val:v * (N(l.unitPrice) || 0), cT:tot(l.cF, l.cL, pack), kT:tot(l.kF, l.kL, pack)};
}
function summary() {
  const s = {lines:0, pending:0, match:0, mismatch:0, recounted:0, varLines:0, noReason:0, short:0, over:0, net:0, extra:0, babies:0, babyPending:0, babyBad:0, babyNoRemark:0};
  ST.S.lines.forEach(l => { const c = calc(l); if (isBaby(l)) { s.babies++; if (c.st === 'pending') s.babyPending++; if (c.st === 'babymiss') s.babyBad++; if (c.st === 'babybad') { s.babyBad++; if (!String(l.remarks || '').trim()) s.babyNoRemark++; } return; } s.lines++; s[c.st]++; if (l.isExtra) s.extra++; if (c.v != null && Math.abs(c.v) > 1e-9) { s.varLines++; if (!l.reason) s.noReason++; if (c.val < 0) s.short += c.val; else s.over += c.val; s.net += c.val; } });
  return s;
}
function renderSession() {

function updDirty() { const t = $('#dirtyTag'); if (t) t.textContent = ST.dirty.size ? `${ST.dirty.size} unsaved line(s)` : (ST.S && canEdit() ? 'All changes saved' : ''); }

  <select id="ic"><option value="">All categories</option>${CATS.map(c => `<option ${F.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select><select id="is"><option value="">Active + Expired</option><option ${F.sec === 'Active' ? 'selected' : ''} value="Active">Active only</option><option ${F.sec === 'Expired' ? 'selected' : ''} value="Expired">Expired Items only</option></select>
  <label class="small"><input type="checkbox" id="ii" ${F.issue ? 'checked' : ''}> only items needing attention</label><span class="sp"></span><span class="mut small">${list.length} shown · page ${ST.itemPage + 1}/${pages}</span><button id="ip" ${ST.itemPage ? '' : 'disabled'}>‹</button><button id="in" ${ST.itemPage < pages - 1 ? '' : 'disabled'}>›</button></div>
  <div class="tw" style="max-height:70vh"><table class="t"><thead><tr><th>Brand</th><th>Type</th><th>PN</th><th>Description</th><th class="ser">Serial</th><th>Lot</th><th>Expiry</th><th>UOM</th><th class="num">Pack</th><th>Location</th><th class="num">System</th><th>Section</th><th>Attention</th></tr></thead><tbody>
  ${page.map(i => `<tr style="cursor:pointer" data-i="${esc(i.id)}"><td>${esc(i.brand)}</td><td>${CAT_SHORT[i.category] || ''}</td><td>${esc(i.pn)}</td><td>${i.motherId ? (m => `<div><span class="badge b-pri" style="white-space:nowrap">↳ BABY of <b>${m ? esc(m.pn) : '?'}</b></span></div><div class="small mut" style="margin-bottom:2px">${m ? esc(m.brand) + ' · ' + esc(String(m.desc).slice(0, 30)) : ''}</div>` )(ST.items.find(x => x.id === i.motherId)) : ''}${esc(i.desc)}</td><td class="ser">${esc(i.serial)}</td><td class="lot">${esc(i.lot)}</td><td>${esc(i.expiry)}</td><td>${esc(i.uom)}</td><td class="num">${esc(i.packSize)}</td><td>${esc(i.location)}</td><td class="num">${esc(i.sysQty)}</td><td>${i.section === 'Expired' ? '<span class="badge b-bad">Expired</span>' : ''}</td><td>${issuesOf(i).map(x => `<span class="chip">${x}</span>`).join('')}${i.flags ? `<span class="small mut" title="${esc(i.flags)}"> ⓘ ${esc(String(i.flags).slice(0, 40))}</span>` : ''}</td></tr>`).join('') || '<tr><td colspan="13" class="mut" style="padding:20px">No items. Use “Import CSV…” to load the item master.</td></tr>'}</tbody></table></div>`;
  const rr = () => { ST.itemPage = 0; renderItems(); };
  $('#iq').onchange = e => { F.q = e.target.value; rr(); }; $('#ib').onchange = e => { F.brand = e.target.value; rr(); }; $('#ic').onchange = e => { F.cat = e.target.value; rr(); }; $('#is').onchange = e => { F.sec = e.target.value; rr(); }; $('#ii').onchange = e => { F.issue = e.target.checked; rr(); };
  $('#ip').onclick = () => { ST.itemPage--; renderItems(); }; $('#in').onclick = () => { ST.itemPage++; renderItems(); };
  $('#addI').onclick = () => itemModal(null); $('#imp').onclick = importModal;
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => itemModal(ST.items.find(i => i.id === tr.dataset.i)));
}
function itemModal(it) {
  const n = !it; it = it || {brand:'', category:'', pn:'', desc:'', serial:'', lot:'', expiry:'', uom:'', packSize:'', location:'', storage:'', sysQty:'', unitPrice:'', notes:'', section:'Active', flags:'', active:''};
  const f = (k, lab, type) => `<div><label>${lab}</label><input id="f_${k}" type="${type || 'text'}" value="${esc(it[k])}"></div>`;
  modal(`<h2>${n ? 'Add item' : 'Edit item'}</h2><div class="fg">${f('brand', 'Brand')}<div><label>Category</label><select id="f_category"><option value=""></option>${CATS.map(c => `<option ${it.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>${f('pn', 'Part number')}${f('uom', 'UOM')}
  <div style="grid-column:1/-1"><label>Description</label><input id="f_desc" value="${esc(it.desc)}"></div>${f('serial', 'Serial no.')}${f('lot', 'Lot no.')}${f('expiry', 'Expiry date (YYYY-MM-DD)')}${f('location', 'Location')}${f('storage', 'Storage (e.g. Chiller 2-8C)')}${f('looseUom', 'Loose UOM (what loose is counted in, e.g. pc, vial, test)')}${f('packSize', 'Pack size (how many loose units make 1 full UOM)', 'number')}${f('sysQty', 'System qty', 'number')}${f('unitPrice', 'Unit price (for variance value)', 'number')}
  <div><label>Section</label><select id="f_section"><option ${it.section !== 'Expired' ? 'selected' : ''}>Active</option><option ${it.section === 'Expired' ? 'selected' : ''}>Expired</option></select></div><div><label>Status</label><select id="f_active"><option value="">In use</option><option value="N" ${it.active === 'N' ? 'selected' : ''}>Archived (hide from new counts)</option></select></div>
  <div style="grid-column:1/-1;background:#f6f7fb;border-radius:8px;padding:10px" id="kidBox"><label style="color:var(--ink);font-weight:600">${n ? 'Baby parts: save this item first, then open it again to add its baby parts.' : 'Baby parts of THIS item (if this is a mother)'}</label>
    ${n ? '' : `<div id="kidList" class="small" style="margin:6px 0"></div><div class="row"><input id="k_q" placeholder="type baby PN to find it" style="width:200px"><select id="k_s" style="flex:1"><option value="">—</option></select><button id="k_add" type="button">+ Add as baby</button></div>`}</div>
  <div style="grid-column:1/-1"><label>Or: is THIS item itself a baby part? If yes: type the MOTHER's PN, then pick the mother. If no, leave as “not a baby part”. (Baby parts are checked on the sheet, not counted.)</label><div class="row"><input id="f_mpn" placeholder="mother PN" style="width:180px"><select id="f_mid" style="flex:1"><option value="">(not a baby part)</option></select></div></div>
  <div style="grid-column:1/-1"><label>Note / flag (clear this once fixed)</label><input id="f_flags" value="${esc(it.flags)}"></div></div>
  <div class="row" style="margin-top:14px"><span class="sp"></span><button id="fX">Cancel</button><button class="pri" id="fOK">Save</button></div>`);
  let cur = it.motherId || ''; const fillM = () => { const v = $('#f_mpn').value.trim().toLowerCase(), c = v.length < 2 ? [] : ST.items.filter(x => x.id !== it.id && x.active !== 'N' && !x.motherId && String(x.pn).toLowerCase().includes(v)).slice(0, 25); $('#f_mid').innerHTML = '<option value="">' + (v.length < 2 ? '(not a baby part)' : (c.length ? '— pick the mother (' + c.length + ' match' + (c.length > 1 ? 'es' : '') + ') —' : '✗ no active item has a PN containing “' + esc($('#f_mpn').value.trim()) + '” — check the PN')) + '</option>' + c.map(x => `<option value="${esc(x.id)}">${esc(x.brand)} · ${esc(x.pn)} · ${esc(x.serial || x.lot || '—')} · ${esc(String(x.desc).slice(0, 40))}</option>`).join(''); if (cur && c.some(x => x.id === cur)) $('#f_mid').value = cur; else if (c.length === 1) $('#f_mid').value = c[0].id; };
  if (cur) { const m = ST.items.find(x => x.id === cur); if (m) { $('#f_mpn').value = m.pn; fillM(); } }
  $('#f_mpn').oninput = () => { cur = ''; fillM(); }; $('#f_mid').onchange = e => { cur = e.target.value; };
  const kids = new Set(n ? [] : ST.items.filter(x => x.motherId === it.id).map(x => x.id)), was = new Set(kids);
  const paintK = () => { if (n) return; $('#kidList').innerHTML = kids.size ? [...kids].map(id => { const x = ST.items.find(y => y.id === id) || {}; return `<div style="padding:2px 0">↳ <b>${esc(x.pn)}</b> · ${esc(x.brand)} · ${esc(String(x.desc).slice(0, 40))} ${x.serial || x.lot ? '· ' + esc(x.serial || x.lot) : ''} <button type="button" data-rm="${esc(id)}" class="small danger" style="padding:0 6px">✕ remove</button></div>`; }).join('') : '<span class="mut">No baby parts yet.</span>'; document.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => { kids.delete(b.dataset.rm); paintK(); }); };
  const fillK = () => { const v = $('#k_q').value.trim().toLowerCase(), c = v.length < 2 ? [] : ST.items.filter(x => x.id !== it.id && x.active !== 'N' && !kids.has(x.id) && !(x.motherId && x.motherId !== it.id) && String(x.pn).toLowerCase().includes(v)).slice(0, 25); $('#k_s').innerHTML = '<option value="">' + (v.length < 2 ? '—' : (c.length ? 'pick the baby (' + c.length + ')' : '✗ no item with that PN')) + '</option>' + c.map(x => `<option value="${esc(x.id)}">${esc(x.brand)} · ${esc(x.pn)} · ${esc(x.serial || x.lot || '—')} · ${esc(String(x.desc).slice(0, 40))}</option>`).join(''); if (c.length === 1) $('#k_s').value = c[0].id; };
  if (!n) { paintK(); $('#k_q').oninput = fillK; $('#k_add').onclick = () => { const id = $('#k_s').value; if (!id) return toast('Type the baby PN, then pick it from the list', true); kids.add(id); $('#k_q').value = ''; fillK(); paintK(); }; }
  $('#fX').onclick = closeModal;
  $('#fOK').onclick = async () => {
    const o = Object.assign({}, it); o.motherId = $('#f_mid').value; ['brand','category','pn','uom','desc','serial','lot','expiry','location','storage','looseUom','packSize','sysQty','unitPrice','section','active','flags'].forEach(k => { o[k] = $('#f_' + k).value.trim(); }); o.brand = o.brand.toUpperCase();
    if (kids.size && o.motherId) return toast('This item cannot be both a mother and a baby. Clear one of them.', true);
    try { const r = await run('saveItem', {item:o}); const i = ST.items.findIndex(x => x.id === r.id); if (i >= 0) ST.items[i] = r; else ST.items.push(r);
      for (const id of new Set([...kids, ...was])) { if (kids.has(id) === was.has(id)) continue; const b = ST.items.find(x => x.id === id); if (!b) continue; const nb = Object.assign({}, b, {motherId:kids.has(id) ? r.id : ''}); const rb = await run('saveItem', {item:nb}); ST.items[ST.items.findIndex(x => x.id === id)] = rb; }
      closeModal(); renderItems(); toast('Item saved'); } catch (e) {}
  };
}
function parseCSV(t) {
  t = t.replace(/^﻿/, ''); const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f !== '' || row.length) { row.push(f); rows.push(row); } return rows;
}
function importModal() {
  modal(`<h2>Import items from CSV</h2><p class="mut small">Use the cleaned <b>items.csv</b>. Columns: ${ITEM_FIELDS.join(', ')}.</p><input type="file" id="cf" accept=".csv,text/csv"><div style="margin:10px 0"><label><input type="radio" name="im" value="replace" checked> Replace the whole item master</label><br><label><input type="radio" name="im" value="append"> Add to existing items</label></div><div id="cp" class="small mut"></div>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button id="cX">Close</button><button class="pri" id="cOK" disabled>Import</button></div>`);
  let items = [];
  $('#cX').onclick = closeModal;
  $('#cf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; const rows = parseCSV(await f.text()), h = rows[0].map(x => x.trim());
    if (h.indexOf('brand') < 0 || h.indexOf('pn') < 0) { $('#cp').textContent = 'This does not look like items.csv (missing brand / pn columns).'; return; }
    items = rows.slice(1).filter(r => r.some(x => x !== '')).map(r => { const o = {}; ITEM_FIELDS.forEach(k => { const i = h.indexOf(k); o[k] = i >= 0 ? (r[i] || '').trim() : ''; }); if (!o.id) o.id = 'ITM' + Math.random().toString(36).slice(2, 8).toUpperCase(); return o; });
    const mi = h.indexOf('motherPn'); if (mi >= 0) { const data = rows.slice(1).filter(r => r.some(x => x !== '')); data.forEach((r, k) => { const mp = (r[mi] || '').trim().toLowerCase(); if (mp) { const m = items.find(x => x !== items[k] && String(x.pn).toLowerCase() === mp); if (m) items[k].motherId = m.id; } }); }
    $('#cp').textContent = `${items.length} items ready.`; $('#cOK').disabled = !items.length;
  };
  $('#cOK').onclick = async () => {
    const mode = document.querySelector('input[name=im]:checked').value;
    if (mode === 'replace' && !confirm('Replace the entire item master? Existing count sessions keep their own copy and are not affected.')) return;
    $('#cOK').disabled = true;
    try { for (let i = 0; i < items.length; i += 400) { $('#cp').textContent = `Importing ${Math.min(i + 400, items.length)} / ${items.length}…`; await run('importItems', {mode, first:i === 0, items:items.slice(i, i + 400)}); }
      const b = await run('bootstrap', {}); ST.items = b.items; closeModal(); renderItems(); toast(`Imported ${items.length} items`); } catch (e) { $('#cOK').disabled = false; }
  };
}

/* ---------- users ---------- */
function renderUsers() {
  $('#main').innerHTML = `<div class="row" style="margin-bottom:10px"><h2 class="sp" style="margin:0">Users</h2><button class="pri" id="au">+ Add user</button></div>
  <p class="mut small">Encoders enter data. Verifiers and approvers view and sign. Logistics type the pre-count only. Counters and checkers work on paper and do not need accounts.</p>
  <div class="tw"><table class="t"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${ST.users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.active === 'N' ? '<span class="badge b-bad">disabled</span>' : 'active'}</td><td><button data-u="${esc(u.name)}">Edit / change PIN</button></td></tr>`).join('')}</tbody></table></div>`;
  $('#au').onclick = () => userModal(null); document.querySelectorAll('button[data-u]').forEach(b => b.onclick = () => userModal(ST.users.find(u => u.name === b.dataset.u)));
}
function userModal(u) {
  const n = !u; u = u || {name:'', role:'encoder', active:'Y'};
  modal(`<h2>${n ? 'Add user' : 'Edit user'}</h2><div class="fg"><div><label>Name</label><input id="uN" value="${esc(u.name)}" ${n ? '' : 'disabled'}></div><div><label>Role</label><select id="uR">${['encoder', 'verifier', 'approver', 'logistics'].map(r => `<option ${u.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
  <div><label>${n ? 'PIN (4–8 digits)' : 'New PIN (leave blank to keep)'}</label><input id="uP" type="password" inputmode="numeric" maxlength="8"></div><div><label>Status</label><select id="uA"><option value="Y">Active</option><option value="N" ${u.active === 'N' ? 'selected' : ''}>Disabled</option></select></div></div>
  <div class="row" style="margin-top:14px"><span class="sp"></span><button id="uX">Cancel</button><button class="pri" id="uOK">Save</button></div>`);
  $('#uX').onclick = closeModal;
  $('#uOK').onclick = async () => { try { const r = await run('saveUser', {name:$('#uN').value, role:$('#uR').value, pin:$('#uP').value, active:$('#uA').value}); const i = ST.users.findIndex(x => x.name === r.name); if (i >= 0) ST.users[i] = r; else ST.users.push(r); closeModal(); renderUsers(); toast('User saved'); } catch (e) {} };
}
boot();
</script></body></html>
